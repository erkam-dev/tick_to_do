name: tick_to_do
description: Elegant and simple To Do app

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: "3.0.0+10"

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  animations: ^2.0.7
  bloc: ^9.0.0
  cloud_firestore: ^6.0.0
  cupertino_icons: ^1.0.1
  dartz: ^0.10.1
  envied: ^1.2.0
  firebase_auth: ^6.0.1
  firebase_core: ^4.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_lints:
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  google_sign_in: ^7.1.1
  in_app_review: ^2.0.9
  intl: ^0.20.2
  json_annotation: ^4.8.1
  shared_preferences: ^2.0.18
  visibility_detector: ^0.4.0+2

dev_dependencies:
  build_runner: ^2.1.8
  envied_generator: ^1.2.0
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.7.1

flutter_native_splash:
  color: '#ffffff'
  image: images/logo.png
  color_dark: '#1a1a1a'
  image_dark: images/logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
     - images/